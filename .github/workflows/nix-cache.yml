name: Nix cache

# Each push to master builds the flake's package and pushes it to the binary cache, so
# `nix run github:sachahjkl/cliche` downloads the program (sachahjkl/deployment-actions, docs/nix-package.md).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  package:
    uses: sachahjkl/deployment-actions/.github/workflows/nix-package.yml@v6.2.0
